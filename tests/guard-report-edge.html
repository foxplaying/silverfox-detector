<!doctype html>
<meta charset="utf-8">
<title>钉钉下载</title>
<a class="logo" href="/download/windows" title="钉钉">下载</a>
<main id="view"></main>
<output id="status">RUNNING</output>
<script>window.module = {exports: {}};</script>
<script src="../extension/shared/control-state.js"></script>
<script src="../extension/shared/ssl-evidence.js"></script>
<script src="../extension/shared/risk-report.js"></script>
<script src="../extension/content/guard.js"></script>
<script src="../extension/content/brand-spoof-detector.js"></script>
<script src="../extension/popup/popup.js"></script>
<script>
(async () => {
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const check = (condition, label) => { if (!condition) throw Error(label); };
  const NS = window.SilverfoxContent, view = document.querySelector("#view"), link = document.querySelector("a.logo");
  const url = "https://www.dingtalk-dl.com/downloads";
  const snapshot = {final:true, brand:"钉钉", url, analysisTxn:"first"};
  NS.state = { _brandSpoofFinalPresented:true, _brandSpoofFinalSnapshot:snapshot, downloadGuardInstalled:true };
  NS.caches = {};
  check(NS.ensureBrandElectionHydrationWatch(), "watcher not installed");
  const renderer = new module.exports.PopupRenderer(view);
  renderer.activeTabId = 1; renderer.activeTabUrl = url;
  const base = {url, analysisTxn:"first", analysisTxnStartedAt:1, timestamp:99, tabId:1, score:0,
    riskLevel:"low", details:[], brandFinalSnapshot:null, analysisComplete:false};
  const done = {...base, analysisComplete:true, brandFinalSnapshot:snapshot, reportSequence:3,
    brandSpoofPortal:true, spoofBrand:"钉钉", downloadGuardInstalled:true, score:38, riskLevel:"high"};
  const render = r => { renderer.renderRisk(r, null, url, null); return view.textContent; };
  for (let i=0; i<2; i++) {
    NS.disableOneSuspiciousElement(link, "/download/windows"); await wait(160);
    check(link.style.pointerEvents === "none" && NS.state._brandSpoofFinalSnapshot === snapshot, "lock invalidated verdict");
    render(done);
    for (const msg of [{...base, reportSequence:4}, {...base, reportSequence:2, identityVerificationUnavailable:true}])
      check(render(msg).includes("已识别仿冒「钉钉」官网"), "progress erased verdict");
    NS.reEnableOneThreatElement(link); await wait(160);
    check(link.getAttribute("href") === "/download/windows" && !link.style.pointerEvents, "link not restored");
    check(NS.state._brandSpoofFinalSnapshot === snapshot, "unlock invalidated verdict");
  }
  document.title = "另一个产品"; await wait(160);
  check(NS.state._brandSpoofFinalSnapshot === null, "changed identity retained stale verdict");
  check(render({...base, analysisTxn:"second", analysisTxnStartedAt:100}).includes("正在核验"), "reload reused verdict");
  document.querySelector("#status").textContent = "PASS";
})().catch(error => { document.querySelector("#status").textContent = "FAIL: " + error.message; });
</script>
